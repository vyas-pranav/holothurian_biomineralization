# Environment for the image / micro-CT / vesicle analyses and the lattice schematics
# (folders 01-04, 07). Versions are pinned to those used for the paper
# (Python 3.7). As in the original environment, the numerical core and libigl
# come from conda-forge and the rest from pip wheels. The exact record of the
# original Windows environment is environment-analysis.win-64.lock.txt.
#
#   conda env create -f environment-analysis.yml
#   conda activate ossicle-analysis
#
# Python 3.7 builds do not exist for Apple-silicon Macs; there, create the
# environment with CONDA_SUBDIR=osx-64 (runs under Rosetta).
name: ossicle-analysis
channels:
  - conda-forge
dependencies:
  - python=3.7
  - numpy=1.20.3
  - scipy=1.7.3
  - igl=2.2.1
  - sknw=0.13
  - tk
  - pip
  - pip:
      - matplotlib==3.5.3
      - pandas==1.3.5
      - networkx==2.6.3
      - vtk==9.1.0
      - pyvista==0.38.5
      - vedo==2023.4.3
      - trimesh==3.15.5
      - meshio==4.4.6
      - scikit-image==0.19.1
      - scikit-learn==1.0.2
      - seaborn==0.12.2
      - shapely==1.8.0
      - opencv-python==4.5.5.64
      - tifffile==2021.11.2
      - imageio==2.15.0
      - openpyxl==3.1.2
      - pillow==9.5.0
      - plotly==5.18.0
      - gmsh==4.11.1
      - pygmsh==7.1.17
      - pygeodesic==0.1.7
      - potpourri3d==0.0.8
      - pyacvd==0.2.8
      - hypertiling==1.3.3
